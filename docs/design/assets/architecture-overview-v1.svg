<text x="1304" y="679.75" font-size="11.4" fill="#4B5563">冻结输入＋双人盲标＋预测准入白名单＋方向评分</text>
<text x="1304" y="698.22" font-size="11.4" fill="#4B5563">▲ 仿真输出正式准入未打通</text>
<rect x="40" y="898" width="1600" height="152" rx="12" fill="#F7F9FB" stroke="#DCE3EA" stroke-width="1.2"/>
<text x="56" y="920.25" font-size="12.5" fill="#6B7280" font-weight="700">D · 存储与运行时</text>
<rect x="58" y="930" width="1564" height="96" rx="10" fill="#EEF2F5" stroke="#6B7A8A" stroke-width="1.6"/>
<text x="72" y="955.31" font-size="13.5" fill="#1F2937" font-weight="700">SQLite（RISKSHIELD_DB，默认 runtime/riskshield.db）</text>
<text x="72" y="979.62" font-size="11.6" fill="#4B5563">cases · snapshots · graphs · simulation_runs / agents / memories / messages / actions / rounds / request_metrics · jobs · reports · alerts · previews</text>
<text x="72" y="998.41" font-size="11.6" fill="#4B5563">后台任务在 API 进程内以线程执行；每轮账本分别记录有效 / 失败 / 超时决策，以及消息条数与记忆引用</text>
<text x="72" y="1017.21" font-size="11.6" fill="#4B5563">API 进程重启会把仍处于 queued / running 的任务标为 failed（interrupted_on_restart），不自动续跑</text>
<rect x="40" y="1066" width="1600" height="148" rx="12" fill="#F7F9FB" stroke="#DCE3EA" stroke-width="1.2"/>
<text x="56" y="1088.25" font-size="12.5" fill="#6B7280" font-weight="700">E · 部署与出口边界</text>
<rect x="58" y="1098" width="512" height="100" rx="10" fill="#EEF2F5" stroke="#6B7A8A" stroke-width="1.6"/>
<text x="72" y="1123.31" font-size="13.5" fill="#1F2937" font-weight="700">容器（Dockerfile + compose.yaml）</text>
<text x="72" y="1147.30" font-size="11.3" fill="#4B5563">api / web / local_gateway 同一镜像 riskshield:day4-local</text>
<text x="72" y="1165.38" font-size="11.3" fill="#4B5563">命名卷 riskshield_runtime 持久化 SQLite</text>
<text x="72" y="1183.46" font-size="11.3" fill="#4B5563">default 网络 internal:true；仅 local_gateway 发布 127.0.0.1 端口</text>
<rect x="586" y="1098" width="512" height="100" rx="10" fill="#FFF6E5" stroke="#C97B0A" stroke-width="1.6"/>
<text x="600" y="1123.31" font-size="13.5" fill="#1F2937" font-weight="700">在线模型网关（model_gateway.py）</text>
<text x="600" y="1147.30" font-size="11.3" fill="#4B5563">需显式设置 RISKSHIELD_ENABLE_MODEL_PROBE=1 与模型密钥</text>
<text x="600" y="1165.38" font-size="11.3" fill="#4B5563">本机离线替身任务不调用：model_calls=0、network_requests=0</text>
<text x="600" y="1183.46" font-size="11.3" fill="#4B5563">该计数是应用运行账本，不是操作系统抓包证据</text>
<rect x="1114" y="1098" width="508" height="100" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="1128" y="1123.31" font-size="13.5" fill="#1F2937" font-weight="700">出口隔离 × 未通过</text>
<text x="1128" y="1147.30" font-size="11.3" fill="#4B5563">API / Web 实测无默认路由</text>
<text x="1128" y="1165.38" font-size="11.3" fill="#4B5563">local_gateway 仍有默认路由 → 不能承诺全容器无外发</text>
<text x="1128" y="1183.46" font-size="11.3" fill="#4B5563">域内部署与全程流量审计尚无证据</text>
<rect x="40" y="1230" width="1600" height="108" rx="12" fill="#FDECEC" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="58" y="1255.78" font-size="13" fill="#9B2C1F" font-weight="700">F · 命题要求但当前未实现或未验证</text>
<text x="58" y="1280.30" font-size="11.6" fill="#9B2C1F">五平台在线覆盖与 ≤15 分钟热点采集延迟　·　生产级多平台采集（当前仅 SEC 与同期帖子存档的受限采集）　·　情感三分类模型</text>
<text x="58" y="1299.44" font-size="11.6" fill="#9B2C1F">GraphRAG 自然语言追问　·　500 Agent × 30 轮在真实历史事件上的完整贯通　·　真实企微/邮件送达与红警 ≤30 分钟时效　·　域内数据不出域</text>
