name: riskshield

services:
  api:
    build: .
    image: riskshield:day4-local
    command: ["uvicorn", "riskshield.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      RISKSHIELD_DB: /app/runtime/riskshield.db
    volumes:
      - riskshield_runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: riskshield:day4-local
    command: ["streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      RISKSHIELD_API_URL: http://api:8000
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    depends_on:
      api:
        condition: service_healthy

  local_gateway:
    image: riskshield:day4-local
    command:
      - python
      - -u
      - -c
      - |
        import asyncio
        from functools import partial

        async def pipe(source, destination):
            while chunk := await source.read(65536):
                destination.write(chunk)
                await destination.drain()
            if destination.can_write_eof():
                destination.write_eof()

        async def relay(reader, writer, target):
            upstream = None
            try:
                upstream_reader, upstream = await asyncio.open_connection(*target)
                await asyncio.gather(
                    pipe(reader, upstream), pipe(upstream_reader, writer)
                )
            except Exception as exc:
                print(f"Local gateway {target}: {exc}", flush=True)
            finally:
                writer.close()
                if upstream is not None:
                    upstream.close()

        async def main():
            api = await asyncio.start_server(
                partial(relay, target=("api", 8000)), "0.0.0.0", 8000
            )
            web = await asyncio.start_server(
                partial(relay, target=("web", 8501)), "0.0.0.0", 8501
            )
            async with api, web:
                await asyncio.gather(api.serve_forever(), web.serve_forever())

        asyncio.run(main())
    ports:
      - "127.0.0.1:${RISKSHIELD_HOST_API_PORT:-8000}:8000"
      - "127.0.0.1:${RISKSHIELD_HOST_WEB_PORT:-8501}:8501"
    networks:
      - default
      - host_ingress
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  riskshield_runtime:

networks:
  default:
    internal: true
  host_ingress: {}
