<rect x="40" y="506" width="1600" height="372" rx="12" fill="#F7F9FB" stroke="#DCE3EA" stroke-width="1.2"/>
<text x="56" y="528.25" font-size="12.5" fill="#6B7280" font-weight="700">C · 业务链路（五段，按运行顺序）</text>
<rect x="58" y="538" width="288" height="322" rx="10" fill="#E8F1FB" stroke="#2E6FB7" stroke-width="1.6"/>
<text x="72" y="563.31" font-size="13.5" fill="#1F2937" font-weight="700">① 来源与案例</text>
<text x="72" y="587.41" font-size="11.4" fill="#4B5563">evidence.py · schemas.py ·</text>
<text x="72" y="605.88" font-size="11.4" fill="#4B5563">store.py · source_probe.py</text>
<text x="72" y="624.35" font-size="11.4" fill="#4B5563">导入案例、来源版本、许可与可见</text>
<text x="72" y="642.81" font-size="11.4" fill="#4B5563">时间、cutoff 快照、观察与标签</text>
<text x="72" y="661.28" font-size="11.4" fill="#4B5563">受限来源采集：SEC / 同期帖子存档</text>
