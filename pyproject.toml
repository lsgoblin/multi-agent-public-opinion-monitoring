[project]
name = "riskshield"
version = "0.1.0"
description = "风控盾 Day 1：历史证据、时间快照与资源就绪检查"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "streamlit>=1.40,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
