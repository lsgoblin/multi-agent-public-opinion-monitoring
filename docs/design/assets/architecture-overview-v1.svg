<text x="688" y="563.31" font-size="13.5" fill="#1F2937" font-weight="700">③ 多智能体仿真</text>
<text x="688" y="587.41" font-size="11.4" fill="#4B5563">simulation.py · tasks.py · capacity.py</text>
<text x="688" y="605.88" font-size="11.4" fill="#4B5563">角色：netizen / customer / media /</text>
<text x="688" y="624.35" font-size="11.4" fill="#4B5563">kol / regulator（独立人设与焦点）</text>
<text x="688" y="642.81" font-size="11.4" fill="#4B5563">独立情绪与信任状态、长期记忆、</text>
<text x="688" y="661.28" font-size="11.4" fill="#4B5563">运行时消息；逐轮落账</text>
<text x="688" y="679.75" font-size="11.4" fill="#4B5563">执行模式 offline_dynamic_substitute</text>
