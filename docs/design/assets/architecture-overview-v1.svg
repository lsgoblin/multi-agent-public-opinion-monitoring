<rect x="982" y="538" width="288" height="322" rx="10" fill="#FFF6E5" stroke="#C97B0A" stroke-width="1.6"/>
<text x="996" y="563.31" font-size="13.5" fill="#1F2937" font-weight="700">④ 报告与预警</text>
<text x="996" y="587.41" font-size="11.4" fill="#4B5563">reporting.py · alerts.py</text>
<text x="996" y="605.88" font-size="11.4" fill="#4B5563">五模块：propagation · emotion_evolution ·</text>
<text x="996" y="624.35" font-size="11.4" fill="#4B5563">key_nodes · risk · recommendations</text>
<text x="996" y="642.81" font-size="11.4" fill="#4B5563">四级：red ≥40% / orange ≥20% /</text>
<text x="996" y="661.28" font-size="11.4" fill="#4B5563">yellow ≥5% / blue；status 为暂定离线判级</text>
<text x="996" y="679.75" font-size="11.4" fill="#4B5563">通知：仅 dry_run 预览（不发送）</text>
<line x1="1272" y1="698" x2="1286" y2="698" stroke="#5B6B7C" stroke-width="1.8" marker-end="url(#head)"/>
<rect x="1290" y="538" width="288" height="322" rx="10" fill="#FFF6E5" stroke="#C97B0A" stroke-width="1.6"/>
