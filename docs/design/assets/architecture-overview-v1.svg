<text x="56" y="162.25" font-size="12.5" fill="#6B7280" font-weight="700">A · 使用与界面</text>
<rect x="58" y="170" width="980" height="76" rx="10" fill="#E8F1FB" stroke="#2E6FB7" stroke-width="1.6"/>
<text x="72" y="195.31" font-size="13.5" fill="#1F2937" font-weight="700">Streamlit Web《风控盾》（ui/app.py）</text>
<text x="72" y="219.83" font-size="11.8" fill="#4B5563">六个页面：今日概览 · 事件证据 · 处置队列 · 五模块报告 · 预警中心 · 关口状态</text>
<text x="72" y="238.12" font-size="11.8" fill="#4B5563">任务/图谱/报告/预警按 ID 互相跳转；进度手动刷新（不自动轮询）；显式显示 partial 与失败类别</text>
<rect x="1054" y="170" width="568" height="76" rx="10" fill="#FFF6E5" stroke="#C97B0A" stroke-width="1.6"/>
<text x="1068" y="195.31" font-size="13.5" fill="#1F2937" font-weight="700">运行边界提示</text>
<text x="1068" y="219.83" font-size="11.8" fill="#4B5563">界面须标明 offline_dynamic_substitute、暂定判级与 dry_run</text>
<text x="1068" y="238.12" font-size="11.8" fill="#4B5563">来源证据图与模拟传播图必须分别标识</text>
<rect x="40" y="290" width="1600" height="196" rx="12" fill="#F7F9FB" stroke="#DCE3EA" stroke-width="1.2"/>
<text x="56" y="312.25" font-size="12.5" fill="#6B7280" font-weight="700">B · 接口层</text>
<rect x="58" y="322" width="1080" height="148" rx="10" fill="#E8F1FB" stroke="#2E6FB7" stroke-width="1.6"/>
<text x="72" y="347.31" font-size="13.5" fill="#1F2937" font-weight="700">FastAPI（src/riskshield/api.py）· TrustedHost 限定 localhost / 127.0.0.1</text>
<text x="72" y="371.62" font-size="11.6" fill="#4B5563">/health　/readiness　/contracts　/channels/status</text>
<text x="72" y="390.41" font-size="11.6" fill="#4B5563">/cases　/cases/{id}/snapshot　/cases/{id}/observations　/cases/{id}/labels</text>
<text x="72" y="409.20" font-size="11.6" fill="#4B5563">/graphs/{id}　/graphs/{id}/query　/simulations　/simulations/{id}/trajectory</text>
<text x="72" y="428.00" font-size="11.6" fill="#4B5563">/demos/day4/run　/day4/historical/jobs　/jobs　/reports　/alerts/assess　/alerts/{id}/previews</text>
<rect x="1156" y="322" width="466" height="148" rx="10" fill="#EEF2F5" stroke="#6B7A8A" stroke-width="1.6"/>
<text x="1170" y="347.31" font-size="13.5" fill="#1F2937" font-weight="700">启动与受理门</text>
<text x="1170" y="371.41" font-size="11.4" fill="#4B5563">启动时校验 RISKSHIELD_MAX_INFLIGHT_CALLS、</text>
<text x="1170" y="388.51" font-size="11.4" fill="#4B5563">RISKSHIELD_SIMULATION_CALL_TIMEOUT_SECONDS、</text>
<text x="1170" y="405.61" font-size="11.4" fill="#4B5563">RISKSHIELD_TASK_TIMEOUT_SECONDS：写错即拒绝启动</text>
<text x="1170" y="422.71" font-size="11.4" fill="#4B5563">受理任务前经 PROCESS_CAPACITY.try_admit()，</text>
<text x="1170" y="439.81" font-size="11.4" fill="#4B5563">容量不足返回结构化拒绝，不排队掩盖资源不足</text>
