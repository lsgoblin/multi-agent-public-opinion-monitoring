<text x="1304" y="587.41" font-size="11.4" fill="#4B5563">evaluation.py · evaluation_alignment.py ·</text>
<text x="1304" y="605.88" font-size="11.4" fill="#4B5563">evaluation_annotation.py ·</text>
<text x="1304" y="624.35" font-size="11.4" fill="#4B5563">evaluation_benchmark.py ·</text>
<text x="1304" y="642.81" font-size="11.4" fill="#4B5563">evaluation_prediction_import.py ·</text>
