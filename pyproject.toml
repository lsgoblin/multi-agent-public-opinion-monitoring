[project]
name = "riskshield"
version = "0.1.0"
description = "风控盾：历史证据、受限来源采集与证据图检索"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "streamlit>=1.40,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--ignore-glob=tests/test_bailian_*.py",
    "--ignore-glob=tests/test_day5_*.py",
    "--ignore-glob=tests/test_final_benchmark_*.py",
    "--ignore-glob=tests/test_simulation_message_pair_*.py",
    "--ignore-glob=tests/test_simulation_performance*.py",
]
